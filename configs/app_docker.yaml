server:
  host: 0.0.0.0
  port: 8000

audio:
  sample_rate: 16000
  frame_ms: 20

vad:
  backend: silero
  silero_model: /app/models/silero_vad.onnx
  silero_threshold: 0.5
  silero_min_silence_ms: 500
  silero_min_speech_ms: 250
  silero_max_speech_ms: 20000
  silero_window_size: 512
  pre_roll_ms: 300
  post_roll_ms: 300
  max_end_silence_ms: 450
  min_speech_ms: 250
  hard_max_segment_ms: 15000
  merge_gap_ms: 1200

postprocess:
  punctuation: true
  punctuation_model: /app/models/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8/model.int8.onnx
  itn: true
  output_script: simplified

asr:
  backend: firered_aed_torch
  model_dir: /app/models/FireRedASR2-AED
  repo_path: /app/vendor/FireRedASR2S
  use_gpu: true
  use_half: true           # BF16 when supported
  beam_size: 10
  nbest: 1
  decode_max_len: 0
  softmax_smoothing: 1.25
  aed_length_penalty: 0.6
  eos_penalty: 1.0
  elm_dir: ""              # optional upstream external LM
  elm_weight: 0.0
  lm_path: ""              # keep empty: MCE LM does not generalize to dictation/meeting
  lm_weight: 0.5
  rank_weight: 0.05
  confidence_weight: 0.0
