name: build-recorder

on:
  workflow_dispatch:
  push:
    tags:
      - "recorder-v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-recorder.txt pyinstaller

      - name: Build FireRedRecorder
        run: python scripts/build_recorder.py

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path dist/FireRedRecorder/* -DestinationPath dist/FireRedRecorder-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FireRedRecorder-windows
          path: dist/FireRedRecorder-windows.zip
